services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nodeai_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: knowledgehub
    ports:
      - "5433:5432"
    volumes:
      - nodeai_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nodeai_redis
    ports:
      - "6379:6379"
    volumes:
      - nodeai_redisdata:/data

volumes:
  nodeai_pgdata:
  nodeai_redisdata: